services:
  postgres:
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"

  redis:
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-6379}:6379"

  ingest-api:
    ports:
      - "127.0.0.1:${INGEST_API_PORT:-3001}:8080"

  dashboard:
    ports:
      - "127.0.0.1:${DASHBOARD_PORT:-3000}:3000"

  worker:
    ports:
      - "127.0.0.1:${WORKER_DIAGNOSTICS_PORT:-8082}:8080"
