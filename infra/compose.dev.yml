services:
  postgres:
    ports:
      - "5432:5432"

  redis:
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"

  ingest-api:
    ports:
      - "${INGEST_API_PORT:-3001}:8080"

  dashboard:
    ports:
      - "${DASHBOARD_PORT:-3000}:3000"

  worker:
    ports:
      - "${WORKER_DIAGNOSTICS_PORT:-8082}:8080"
